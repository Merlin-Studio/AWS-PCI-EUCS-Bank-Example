transitGateways:
  - name: main-tgw
    account: Network
    region: eu-central-1
    shareTargets:
      organizationalUnits:
        - Workloads
        - Infrastructure
    asn: 64512
    dnsSupport: enable
    vpnEcmpSupport: enable
    defaultRouteTableAssociation: disable
    defaultRouteTablePropagation: disable
    autoAcceptSharingAttachments: enable
    routeTables:
      - name: main-tgw-inspection
        routes:
          - destinationCidrBlock: 10.10.0.0/16
            attachment:
              transitGatewayPeeringName: primary-to-secondary
          - destinationCidrBlock: 10.11.0.0/16
            attachment:
              transitGatewayPeeringName: primary-to-secondary
      - name: main-tgw-spokes
        routes:
          - destinationCidrBlock: 0.0.0.0/0
            attachment:
              vpcName: inspection
              account: Network
      - name: main-tgw-cde
        routes:
          - destinationCidrBlock: 0.0.0.0/0
            attachment:
              vpcName: inspection
              account: Network
  - name: main-tgw-west
    account: Network
    region: eu-west-3
    shareTargets:
      organizationalUnits:
        - Workloads
        - Infrastructure
    asn: 64513
    dnsSupport: enable
    vpnEcmpSupport: enable
    defaultRouteTableAssociation: disable
    defaultRouteTablePropagation: disable
    autoAcceptSharingAttachments: enable
    routeTables:
      - name: main-tgw-west-Associations
        routes:
          - destinationCidrBlock: 0.0.0.0/0
            attachment:
              transitGatewayPeeringName: primary-to-secondary
      - name: main-tgw-west-Propagations

# Inter-region peering (warm-standby DR path). LZA establishes the peering and
# wires the requester/accepter route-table associations.
transitGatewayPeering:
  - name: primary-to-secondary
    requester:
      transitGatewayName: main-tgw
      account: Network
      region: eu-central-1
      routeTableAssociations: main-tgw-spokes
    accepter:
      transitGatewayName: main-tgw-west
      account: Network
      region: eu-west-3
      routeTableAssociations: main-tgw-west-Associations
      autoAccept: true




centralNetworkServices:
  # Centralized inspection (topology SoT). The AWS Network Firewall lives in the
  # inspection VPC; LZA authors stateful rules in firewall-rules/rules.txt (it
  # does not reference AWS-managed rule group ARNs the way the other formats do).
  delegatedAdminAccount: Network
  networkFirewall:
    firewalls:
      - name: inspection-nfw
        firewallPolicy: inspection-nfw-policy
        vpc: inspection
        subnets:
          - insp-private-a
          - insp-private-b
        loggingConfiguration:
          - destination: cloud-watch-logs
            type: ALERT
          - destination: cloud-watch-logs
            type: FLOW
    policies:
      - name: inspection-nfw-policy
        regions:
          - eu-central-1
        firewallPolicy:
          statelessDefaultActions:
            - aws:forward_to_sfe
          statelessFragmentDefaultActions:
            - aws:forward_to_sfe
          statefulRuleGroups:
            - name: inspection-nfw-stateful
        shareTargets:
          organizationalUnits:
            - Workloads
    rules:
      - name: inspection-nfw-stateful
        regions:
          - eu-central-1
        capacity: 1000
        type: STATEFUL
        ruleGroup:
          rulesSource:
            rulesFile: firewall-rules/rules.txt
        shareTargets:
          organizationalUnits:
            - Workloads

dhcpOptions:
  []

endpointPolicies:
  - name: Default
    document: vpc-endpoint-policies/default.json